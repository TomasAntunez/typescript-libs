name: Publish packages to npm

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      typescript-config:
        description: '@chuli-dev/typescript-config'
        required: false
        type: boolean
        default: false
      eslint-config:
        description: '@chuli-dev/eslint-config'
        required: false
        type: boolean
        default: false
      prettier-config:
        description: '@chuli-dev/prettier-config'
        required: false
        type: boolean
        default: false
      errors:
        description: '@chuli-dev/errors'
        required: false
        type: boolean
        default: false
      value-objects:
        description: '@chuli-dev/value-objects'
        required: false
        type: boolean
        default: false
      cli-kit:
        description: '@chuli-dev/cli-kit'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish packages to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Publish selected packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail

          selected=$(echo '${{ toJson(inputs) }}' | jq -r 'to_entries[] | select(.value == true) | .key')

          if [ -z "$selected" ]; then
            echo "No packages selected. Nothing to publish."
            exit 0
          fi

          while IFS= read -r pkg; do
            echo "Publishing @chuli-dev/$pkg..."

            if npm publish --workspace="@chuli-dev/$pkg"; then
              echo "✅ @chuli-dev/$pkg published successfully"
            else
              echo "❌ Failed to publish @chuli-dev/$pkg"
            fi
          done <<< "$selected"
